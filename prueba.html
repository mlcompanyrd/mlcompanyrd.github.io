<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de conexión · ML COMPANY</title>
<style>
body{margin:0;background:#0a0614;color:#fff;font:16px/1.5 system-ui,sans-serif;padding:1.2rem;max-width:640px;margin:auto}
h1{font-size:1.4rem}.card{background:#ffffff12;border:1px solid #ffffff2a;border-radius:14px;padding:1rem;margin:.8rem 0}
input,button{font:inherit;padding:.6rem .8rem;border-radius:10px;border:1px solid #ffffff44;background:#ffffff14;color:#fff;width:100%;margin:.25rem 0}
button{background:linear-gradient(135deg,#ff2d95,#8a2be2);border:0;font-weight:700;cursor:pointer}
.ok{color:#5dffb0}.no{color:#ff7a9c}small{color:#d3c8f0}pre{white-space:pre-wrap;word-break:break-word;font-size:.8rem;color:#d3c8f0;margin:.3rem 0 0}
</style></head><body>
<h1>Prueba de conexión</h1>
<p><small>Abre este archivo en tu navegador (doble clic) y pulsa el botón. Te dirá qué falla exactamente. Es solo para ti: no lo subas a GitHub.</small></p>
<div class="card"><b>Usuario de la nube (opcional)</b><br><small>El mismo que creaste en Supabase → Authentication → Users</small>
<input id="e" type="email" placeholder="Correo" value="manuel16339688@gmail.com"><input id="p" type="password" placeholder="Contraseña"></div>
<button onclick="run()">Probar ahora</button>
<div id="out"></div>
<script>
const URL_='https://ljxvlxixazmmaktvguxk.supabase.co',KEY='sb_publishable_F8_ijLJprTbbuFptk8qv2A_qMIPV5w2',FS='https://formspree.io/f/mkjgdlzn';
const out=document.getElementById('out');
function add(ok,t,h,raw){out.insertAdjacentHTML('beforeend',`<div class="card"><b class="${ok?'ok':'no'}">${ok?'✅':'❌'} ${t}</b>${h?`<br>${h}`:''}${raw?`<pre>${String(raw).replace(/</g,'&lt;').slice(0,300)}</pre>`:''}</div>`)}
async function call(path,o={}){try{const r=await fetch(URL_+path,{...o,headers:{apikey:KEY,'Content-Type':'application/json',...(o.headers||{})}});return{s:r.status,t:await r.text()}}catch(e){return{s:0,t:String(e)}}}
async function run(){out.innerHTML='';
let r=await call('/rest/v1/ml_docs?select=col&limit=1');
if(r.s===200)add(true,'La tabla ml_docs existe y la clave funciona');
else if(r.s===404||/PGRST205|42P01/.test(r.t))add(false,'La tabla ml_docs NO existe','Abre Supabase → SQL Editor, pega todo supabase-setup.sql y pulsa Run.',r.t);
else if(r.s===401||r.s===403)add(false,'Supabase rechazó la clave','Revisa que la clave sea la "publishable/anon" de ESTE proyecto.',r.t);
else if(r.s===0)add(false,'No se pudo conectar con Supabase','Revisa tu internet o que la URL del proyecto sea correcta.',r.t);
else add(false,'Respuesta inesperada de Supabase ('+r.s+')','',r.t);
const id=Date.now()*1000;
r=await call('/rest/v1/ml_docs',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({col:'log',id:String(id),data:{id,u:'Sistema',a:'Prueba de conexión',i:'',t:''}})});
if(r.s===201||r.s===200||r.s===204)add(true,'Los visitantes pueden enviar datos a Supabase');
else if(/42501|row-level/i.test(r.t))add(false,'Faltan permisos (políticas) en la tabla','Ejecuta de nuevo supabase-setup.sql completo en SQL Editor.',r.t);
else if(r.s===404)add(false,'No se pudo enviar: la tabla no existe','Ejecuta supabase-setup.sql.',r.t);
else add(false,'No se pudo enviar a Supabase ('+r.s+')','',r.t);
try{const f=await fetch(FS,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_subject:'ML COMPANY · Prueba de conexión',mensaje:'Si lees esto, Formspree funciona'})});const t=await f.text();
if(f.ok)add(true,'Formspree aceptó el mensaje','Revisa tu correo (y la carpeta de spam). La primera vez te pedirá confirmar el correo.');
else add(false,'Formspree rechazó el mensaje ('+f.status+')','Entra a tu cuenta de Formspree, confirma tu correo y revisa que el formulario esté activo.',t)}catch(e){add(false,'No se pudo conectar con Formspree','',e)}
const em=document.getElementById('e').value.trim(),pw=document.getElementById('p').value;
if(pw){const a=await call('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:em,password:pw})});
if(a.s===200)add(true,'El usuario de la nube inicia sesión correctamente');
else add(false,'No se pudo iniciar sesión en la nube','El usuario no existe en Supabase → Authentication → Users, o la contraseña es incorrecta, o falta confirmar el correo.',a.t)}
else add(true,'Inicio de sesión no probado','Escribe la contraseña arriba si quieres probarlo.')}
</script></body></html>
