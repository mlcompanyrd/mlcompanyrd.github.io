<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ML COMPANY · Powered by ML Music</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0614;--sf:rgba(16,7,36,.72);--sf2:rgba(72,28,128,.62);--tx:#fff;--mu:#d3c8f0;--ac:#ff2d95;--ac2:#00e5ff;--gold:#ffb800;--vio:#8a2be2;--ln:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:70px;scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "DM Sans",system-ui,sans-serif}
h1,h2,h3,.lg{font-family:Syne,"DM Sans",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.btn{background:linear-gradient(135deg,var(--ac),var(--vio));box-shadow:0 6px 22px #ff2d9555;border:0;border-radius:99px;padding:.65rem 1.2rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.gh{background:#ffffff10;box-shadow:none;border:1px solid var(--ac2)}.btn.sm{padding:.3rem .8rem;font-size:.85rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:1rem;padding:.8rem 5vw;background:#0a0614b8;backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.top nav{display:flex;gap:1.2rem;margin-left:auto;color:var(--mu)}.top nav a{text-decoration:none}
.lg{font-weight:800;font-size:1.2rem;background:linear-gradient(90deg,var(--ac),var(--gold),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
section{padding:4.5rem 5vw;max-width:1100px;margin:auto}
.hero{min-height:78vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;max-width:none}
.vinyl{position:absolute;right:-12vw;top:50%;width:min(70vw,640px);aspect-ratio:1;border-radius:50%;transform:translateY(-50%);background:radial-gradient(circle,var(--ac) 0 9%,#0a0614 9.5% 11%,transparent 11%),repeating-radial-gradient(circle,#ffffff14 0 2px,transparent 3px 6px),conic-gradient(#ff2d95,#ffb800,#00e5ff,#8a2be2,#ff2d95);animation:spin 28s linear infinite;opacity:.9}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.vinyl{animation:none}}
.hero h1{font-size:clamp(3rem,12vw,8rem);line-height:.95;position:relative;background:linear-gradient(100deg,#fff 0%,var(--ac) 35%,var(--gold) 65%,var(--ac2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px #000a)}
.hero p{max-width:30ch;color:var(--mu);font-size:1.2rem;position:relative}.row{display:flex;gap:.7rem;flex-wrap:wrap;position:relative}
h2{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:1.5rem}h2::after{content:"";display:block;width:64px;height:4px;border-radius:4px;margin-top:.5rem;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:1.2rem;backdrop-filter:blur(10px)}
.art{text-align:center;cursor:pointer;transition:background .2s}.art:hover{background:var(--sf2);border-color:var(--ac);box-shadow:0 0 30px #ff2d9566}.art small{color:var(--mu)}
.av{border-radius:50%;display:grid;place-items:center;font:800 1.6rem Syne,sans-serif;object-fit:cover;margin:0 auto .7rem;background:linear-gradient(135deg,var(--ac),var(--vio),var(--ac2));box-shadow:0 0 0 3px #ffffff30,0 0 22px #ff2d9566}
.f{display:grid;gap:.7rem;max-width:620px}.f2{grid-template-columns:1fr 1fr}
input,select,textarea{background:#ffffff14;border:1px solid var(--ln);border-radius:10px;padding:.6rem .8rem;width:100%}
.hp{position:absolute;left:-9999px}
footer{background:#0a061499;backdrop-filter:blur(8px);border-top:1px solid var(--ln);padding:2rem 5vw;color:var(--mu);display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between}
.ov{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:9;padding:1rem}.ov .card{max-width:440px;width:100%;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--ac2);color:#08242a;padding:.6rem 1.1rem;border-radius:99px;font-weight:700;z-index:20}
.adm{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.adm aside{background:var(--sf);padding:1rem;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:.3rem}
.adm aside button{background:none;border:0;text-align:left;padding:.6rem .8rem;border-radius:10px;cursor:pointer;color:var(--mu)}
.adm aside button.on{background:var(--sf2);color:var(--tx);box-shadow:inset 3px 0 var(--ac)}.adm main{padding:1.5rem;min-width:0;background:#0a061466}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.8rem;margin-bottom:1.5rem}.stats b{font:800 2rem Syne,sans-serif;display:block;width:fit-content;background:linear-gradient(90deg,var(--ac),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.li{display:flex;gap:.8rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.li>div{flex:1;min-width:140px}
.tag{font-size:.78rem;padding:.1rem .6rem;border-radius:99px;background:var(--sf2);color:var(--ac2)}
.msg{background:var(--sf2);border-radius:12px;padding:.7rem 1rem;margin:.5rem 0}.msg.me{background:#ff2d9533;border:1px solid #ff2d9566}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:1rem}
.lk{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.5rem;margin-top:.5rem}.lr{display:flex;gap:.5rem;align-items:center}.lr svg{flex:none}
.soc{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin:.8rem 0}.soc a{transition:transform .15s}.soc a:hover{transform:scale(1.12)}.art .soc{margin:.6rem 0 0}
.bg{position:fixed;inset:0;z-index:-1;isolation:isolate;overflow:hidden;background:#0a0614}
.aur{position:absolute;inset:-10%;background:radial-gradient(45% 40% at 15% 20%,#ff2d9577,transparent 70%),radial-gradient(40% 40% at 85% 25%,#00e5ff77,transparent 70%),radial-gradient(50% 45% at 70% 90%,#8a2be2aa,transparent 70%),radial-gradient(35% 35% at 10% 85%,#ffb80077,transparent 70%);filter:blur(30px);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(3%,-3%) scale(1.08)}}

{id:2,art:'Lía Roca',full:'',genre:'Trap',city:'Santiago',country:'República Dominicana',bio:'Trap melódico con producción propia.',links:{ig:'https://instagram.com/liaroca',tt:'https://tiktok.com/@liaroca'}},

const KEYS=['artists','apps','msgs','team','social','log'],SK='mlco_data_v1';let warned=0;
try{const d=JSON.parse(localStorage.getItem(SK)||'null');if(d)KEYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]})}catch(e){}
function save(){try{if(S.log.length>200)S.log.length=200;const o={};KEYS.forEach(k=>o[k]=S[k]);localStorage.setItem(SK,JSON.stringify(o))}catch(e){if(!warned){warned=1;toast('No se pudo guardar: el almacenamiento está lleno (prueba con fotos más pequeñas)')}}}
S.team.forEach((t,i)=>{if(t.id==null)t.id=i+1});S.log.forEach((e,i)=>{if(e.id==null)e.id=-i});
Object.defineProperty(S,'unread',{get:()=>S.apps.filter(a=>a.st==='Pendiente').length+S.msgs.filter(m=>m.st==='Nuevo').length,set(){},enumerable:true,configurable:true});
const COLS={artists:'asc',apps:'asc',msgs:'desc',team:'asc',log:'desc'},LAST={artists:{},apps:{},msgs:{},team:{},log:{},social:''};
let DB=null,INIT=false,syncing=0,again=0,werr=0,pend=0;
const clone=o=>JSON.parse(JSON.stringify(o));
function softR(){if(S.view==='login')return;const a=document.activeElement;if(a&&$app.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pend=1;return}R()}
document.addEventListener('focusout',()=>{if(pend)setTimeout(()=>{if(pend){pend=0;softR()}},300)});
async function sync(){if(!DB)return;if(syncing){again=1;return}syncing=1;
try{do{again=0;
for(const k in COLS){const col=DB.collection(k),seen={};
for(const it of S[k]){const id=String(it.id),t=JSON.stringify(it);seen[id]=1;if(LAST[k][id]!==t){await col.doc(id).set(JSON.parse(t));LAST[k][id]=t}}
for(const id in LAST[k])if(!seen[id]){await col.doc(id).delete();delete LAST[k][id]}}
const so=JSON.stringify(S.social);if(LAST.social!==so){await DB.doc('meta/social').set(clone(S.social));LAST.social=so}
if(!INIT)await DB.doc('meta/init').set({at:Date.now()});
}while(again)}catch(e){if(!werr){werr=1;toast('No se pudo guardar en la nube: '+(e&&e.code==='invalid_argument'?'tu cuenta no tiene permiso de escritura en esta página':'error '+(e&&e.code||''))+'. Los cambios quedan solo en este navegador.')}}
syncing=0}
function listen(k){DB.collection(k).orderBy('id',COLS[k]).onSnapshot(sn=>{const arr=sn.docs.map(d=>clone(d.data()));LAST[k]={};arr.forEach(o=>LAST[k][String(o.id)]=JSON.stringify(o));S[k]=arr;softR()},()=>{})}
function startDB(d){DB=d;DB.doc('meta/init').onSnapshot(sn=>{if(sn.exists&&!INIT){INIT=true;Object.keys(COLS).forEach(listen);
DB.doc('meta/social').onSnapshot(x=>{if(x.exists){S.social=clone(x.data());LAST.social=JSON.stringify(S.social);softR()}},()=>{})}},()=>{})}
if(window.claude&&claude.use)claude.use('db').then(d=>{if(d)startDB(d)}).catch(()=>{});
const shrink=(f,m=480)=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)});

function inv(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));S.team.push({id:Date.now(),n:o.n,e:o.e,r:o.r,st:'Invitado'});log(WHO[S.role],'Invitó a un administrador',o.n);toast('Invitación registrada');R()}
const H={super:'8db6ac1c07274720d2c9953dd19d759efe68311bdc52f56e117692de980394d6',admin:'b1f1fdd68faabe78d07b04d40c674faf37be962a088440c1e809506beb216722'};let fails=0,lock=0;
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function doLogin(e){e.preventDefault();const f=e.target,er=document.getElementById('err');if(Date.now()<lock){er.textContent='Demasiados intentos. Espera 30 segundos.';return}
const x=await sha('mlco|'+f.u.value.trim().toLowerCase()+'|'+f.p.value);const role=Object.keys(H).find(k=>H[k]===x);
if(role){fails=0;S.role=role;log(WHO[role],'Inició sesión','Panel');go('admin')}else{if(++fails>=5){lock=Date.now()+30000;fails=0}er.textContent='Usuario o contraseña incorrectos.'}}
function tab(t){S.tab=t;if(t==='dash'){S.unread=0;save()}R()}
function editBio(id,v){const a=S.artists.find(x=>x.id===id);a.bio=v;log(WHO[S.role],'Editó el perfil',a.art);toast('Perfil actualizado')}
function toggleVf(id){const a=S.artists.find(x=>x.id===id);a.verified=!a.verified;log(WHO[S.role],a.verified?'Verificó al artista':'Quitó la verificación a',a.art);toast(a.verified?'Artista verificado':'Verificación quitada');R()}
function delArt(id){const a=S.artists.find(x=>x.id===id);S.artists=S.artists.filter(x=>x.id!==id);log(WHO[S.role],'Eliminó el perfil',a.art);R()}
function setSoc(i,v){const k=Object.keys(S.social)[i];S.social[k]=v;log(WHO[S.role],'Cambió enlace de red',k);toast('Guardado')}
function editArt(id,k,v){const a=S.artists.find(x=>x.id===id);v=v.trim();if(k==='art'&&!v){toast('El nombre no puede quedar vacío');return R()}a[k]=v;log(WHO[S.role],'Editó '+({art:'el nombre',genre:'el género',photo:'la foto',city:'la ciudad',country:'el país'}[k])+' de',a.art);toast('Cambios guardados');if(k==='photo'||(k==='art'&&!a.photo))R()}
function setPhoto(id,inp){const f=inp.files[0];if(!f)return;if(f.size>8e6){toast('La foto pesa más de 8 MB');inp.value='';return}shrink(f).then(d=>editArt(id,'photo',d),()=>toast('No se pudo leer la imagen'))}

const ico=(k,z)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" role="img" aria-label="${PL.find(p=>p[0]===k)[1]}" style="display:block">${G[k]}</svg>`;
function lk(k,v){v=(v||'').trim();if(!v)return '';if(/^https?:\/\//i.test(v))return v;const b={ig:'https://instagram.com/',tt:'https://tiktok.com/@',x:'https://x.com/',yt:'https://youtube.com/@',fb:'https://facebook.com/'}[k];if(b&&/^@?[\w.]+$/.test(v))return b+v.replace(/^@/,'');if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v))return 'https://'+v;return ''}
const soc=(a,z)=>{const l=PL.filter(p=>a.links&&a.links[p[0]]);return l.length?`<div class=soc onclick="event.stopPropagation()" onkeydown="event.stopPropagation()">${l.map(([k,n])=>`<a href="${esc(a.links[k])}" target="_blank" rel="noopener noreferrer" title="${n}" aria-label="${n}">${ico(k,z)}</a>`).join('')}</div>`:''};
const linksUI=a=>`<details ${S.open===a.id?'open':''} ontoggle="S.open=this.open?${a.id}:null"><summary style="cursor:pointer;color:var(--ac2)">Enlaces de plataformas</summary><div class=lk>${PL.map(([k,n])=>`<label class=lr>${ico(k,28)}<input value="${esc((a.links||{})[k]||'')}" placeholder="${n}: enlace o usuario" aria-label="${n}" onchange="setLink(${a.id},'${k}',this)"></label>`).join('')}</div></details>`;
function setLink(id,k,el){const a=S.artists.find(x=>x.id===id),v=el.value.trim(),u=lk(k,v);if(v&&!u){toast('Enlace no válido: pega la URL completa o el usuario');return}a.links=a.links||{};a.links[k]=u;el.value=u;log(WHO[S.role],'Editó el enlace de '+k+' de',a.art);toast(u?'Enlace guardado':'Enlace quitado')}
R();
